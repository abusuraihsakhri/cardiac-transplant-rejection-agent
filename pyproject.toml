[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-transplant-rejection-engine"
version = "2.0.0"
description = "HeartTransplant Sentinel: Endomyocardial Biopsy ISHLT Rejection & DSA Tracker"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cardiac-transplant-rejection-engine = "cardiac_transplant_rejection_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cardiac-transplant-rejection-engine"
Repository = "https://github.com/abusuraihsakhri/cardiac-transplant-rejection-engine.git"
