[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-transplant-rejection-engine"
version = "2.1.0"
description = "Transparent heart-transplant rejection surveillance heuristic for research and education"
readme = "README.md"
authors = [{ name = "NAME" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["build>=1", "pytest>=8", "ruff>=0.12"]

[project.scripts]
cardiac-transplant-rejection = "cli:main"
cardiac-transplant-rejection-engine = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cardiac-transplant-rejection-agent"
Repository = "https://github.com/abusuraihsakhri/cardiac-transplant-rejection-agent.git"

[tool.setuptools]
py-modules = [
    "cardiac_transplant_rejection",
    "cli",
    "heart_transplant",
    "biopsy_grading",
    "immune_monitoring",
]

[tool.setuptools.packages.find]
include = ["cardiac_transplant_rejection_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
