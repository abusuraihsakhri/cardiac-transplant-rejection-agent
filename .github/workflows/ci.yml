name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"

      - name: Lint
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q cardiac_transplant_rejection.py cli.py cardiac_transplant_rejection_agent

      - name: Run test suite
        run: python -m pytest -v

      - name: Verify installed CLI
        run: |
          cardiac-transplant-rejection audit --case-id CI-SMOKE --acr 1R --json > /tmp/audit.json
          cardiac-transplant-rejection batch -i sample.csv -o out_smoke.csv
          test -s /tmp/audit.json
          test -s out_smoke.csv

      - name: Verify package dependencies
        run: python -m pip check

      - name: Build distribution
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Static web smoke test
        if: matrix.python-version == '3.12'
        run: |
          node --check docs/app.js
          python -m http.server 8765 --directory docs >/tmp/pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/ | grep -q "Analyze"
          curl --fail --silent http://127.0.0.1:8765/app.js >/dev/null
